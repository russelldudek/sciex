name: Publish candidate campaign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect publication bundle
        id: bundle
        shell: bash
        run: |
          if [[ -f campaign.ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "incomplete=false" >> "$GITHUB_OUTPUT"
          elif compgen -G 'campaign.part*' > /dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "incomplete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize campaign source
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          cat campaign.part* | base64 --decode | tar -xzf -
          rm -f campaign.part* campaign.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish SCIEX candidate campaign"
          git push origin HEAD:main

      - name: Configure Pages
        if: steps.bundle.outputs.incomplete != 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.bundle.outputs.incomplete != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        if: steps.bundle.outputs.incomplete != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
